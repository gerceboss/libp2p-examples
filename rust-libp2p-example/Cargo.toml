[package]
name = "yjs-libp2p-relay"
version = "0.1.0"
edition = "2021"
description = "Rust libp2p relay server for Yjs collaborative spreadsheet (bootstrap peer)"

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
libp2p = { version = "0.53", features = ["tokio", "tcp", "websocket", "dns", "noise", "yamux", "identify", "ping", "gossipsub", "relay", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
futures = "0.3"
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
